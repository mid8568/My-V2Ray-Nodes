name: XrayVIP V2Ray to Clash Mi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq python3 python3-yaml gzip

      - name: Download Mihomo
        shell: bash
        run: |
          set -e

          URL=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-compatible-.*\\.gz$")) | .browser_download_url' \
            | head -n 1)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "无法找到 Mihomo"
            exit 1
          fi

          curl -fL "$URL" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo

          ./mihomo -v

      - name: Download XrayVIP V2Ray subscription
        run: |
          set -e

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 120 \
            "https://www.xrayvip.com/free.txt" \
            -o source.txt

          test -s source.txt

          echo "源文件大小:"
          wc -c source.txt

      - name: Convert V2Ray subscription to Clash
        run: |
          python3 <<'PY'
          import base64
          import json
          import re
          import urllib.parse
          import yaml
          from pathlib import Path

          text = Path("source.txt").read_text(encoding="utf-8", errors="ignore").strip()

          def b64decode_text(s):
              s = re.sub(r"\s+", "", s)

              for decoder in (
                  lambda x: base64.b64decode(x + "=" * (-len(x) % 4)),
                  lambda x: base64.urlsafe_b64decode(x + "=" * (-len(x) % 4))
              ):
                  try:
                      result = decoder(s).decode("utf-8", errors="ignore").strip()
                      if result:
                          return result
                  except Exception:
                      pass

              return ""

          decoded = b64decode_text(text)

          if "://" in decoded:
              content = decoded
          else:
              content = text

          lines = []

          for line in content.splitlines():
              line = line.strip()
              if not line:
                  continue

              if "://" in line:
                  lines.append(line)

          if not lines:
              raise SystemExit("没有解析到任何 V2Ray 节点")

          print("解析到节点链接:", len(lines))

          proxies = []
          used_names = set()

          def unique_name(name):
              name = str(name or "").strip()

              if not name:
                  name = "Node"

              name = name.replace("\n", " ").replace("\r", " ")

              if name not in used_names:
                  used_names.add(name)
                  return name

              i = 2

              while f"{name} {i}" in used_names:
                  i += 1

              final = f"{name} {i}"
              used_names.add(final)
              return final

          def to_int(v, default=0):
              try:
                  return int(v)
              except Exception:
                  return default

          def add_proxy(p):
              if not p:
                  return

              if "name" not in p:
                  p["name"] = f"Node {len(proxies) + 1}"

              p["name"] = unique_name(p["name"])
              proxies.append(p)

          def parse_vmess(link):
              raw = link[len("vmess://"):].strip()

              try:
                  raw += "=" * (-len(raw) % 4)
                  obj = json.loads(base64.b64decode(raw).decode("utf-8"))
              except Exception:
                  return None

              name = obj.get("ps") or obj.get("remark") or "VMess"

              p = {
                  "name": name,
                  "type": "vmess",
                  "server": obj.get("add"),
                  "port": to_int(obj.get("port")),
                  "uuid": obj.get("id"),
                  "alterId": to_int(obj.get("aid"), 0),
                  "cipher": obj.get("scy") or "auto",
                  "udp": True
              }

              if not p["server"] or not p["port"] or not p["uuid"]:
                  return None

              if str(obj.get("tls", "")).lower() == "tls":
                  p["tls"] = True

              net = obj.get("net", "")

              if net == "ws":
                  p["network"] = "ws"

                  ws = {
                      "path": obj.get("path") or "/",
                      "headers": {}
                  }

                  host = obj.get("host")

                  if host:
                      ws["headers"]["Host"] = host

                  p["ws-opts"] = ws

              elif net == "grpc":
                  p["network"] = "grpc"

                  service = obj.get("path") or obj.get("serviceName") or ""

                  p["grpc-opts"] = {
                      "grpc-service-name": service
                  }

              elif net == "h2":
                  p["network"] = "h2"

                  p["h2-opts"] = {
                      "path": obj.get("path") or "/"
                  }

              return p

          def parse_vless(link):
              try:
                  u = urllib.parse.urlsplit(link)
                  q = urllib.parse.parse_qs(u.query)
              except Exception:
                  return None

              uuid = urllib.parse.unquote(u.username or "")
              server = u.hostname
              port = u.port

              if not uuid or not server or not port:
                  return None

              name = urllib.parse.unquote(u.fragment or "") or "VLESS"

              p = {
                  "name": name,
                  "type": "vless",
                  "server": server,
                  "port": port,
                  "uuid": uuid,
                  "udp": True
              }

              encryption = q.get("encryption", ["none"])[0]

              if encryption:
                  p["encryption"] = encryption

              flow = q.get("flow", [""])[0]

              if flow:
                  p["flow"] = flow

              security = q.get("security", [""])[0]

              if security in ("tls", "reality"):
                  p["tls"] = True

              sni = q.get("sni", [""])[0]

              if sni:
                  p["servername"] = sni

              fp = q.get("fp", [""])[0]

              if fp:
                  p["client-fingerprint"] = fp

              if security == "reality":
                  public_key = q.get("pbk", [""])[0]
                  short_id = q.get("sid", [""])[0]

                  reality = {}

                  if public_key:
                      reality["public-key"] = public_key

                  if short_id:
                      reality["short-id"] = short_id

                  if reality:
                      p["reality-opts"] = reality

              network = q.get("type", ["tcp"])[0]

              if network == "ws":
                  p["network"] = "ws"

                  ws = {
                      "path": q.get("path", ["/"])[0],
                      "headers": {}
                  }

                  host = q.get("host", [""])[0]

                  if host:
                      ws["headers"]["Host"] = host

                  p["ws-opts"] = ws

              elif network == "grpc":
                  p["network"] = "grpc"

                  p["grpc-opts"] = {
                      "grpc-service-name": q.get("serviceName", [""])[0]
                  }

              elif network == "h2":
                  p["network"] = "h2"

                  p["h2-opts"] = {
                      "path": q.get("path", ["/"])[0]
                  }

              return p

          def parse_trojan(link):
              try:
                  u = urllib.parse.urlsplit(link)
                  q = urllib.parse.parse_qs(u.query)
              except Exception:
                  return None

              password = urllib.parse.unquote(u.username or "")

              if not password or not u.hostname or not u.port:
                  return None

              name = urllib.parse.unquote(u.fragment or "") or "Trojan"

              p = {
                  "name": name,
                  "type": "trojan",
                  "server": u.hostname,
                  "port": u.port,
                  "password": password,
                  "udp": True
              }

              sni = q.get("sni", [""])[0]

              if sni:
                  p["sni"] = sni

              network = q.get("type", ["tcp"])[0]

              if network == "ws":
                  p["network"] = "ws"

                  ws = {
                      "path": q.get("path", ["/"])[0],
                      "headers": {}
                  }

                  host = q.get("host", [""])[0]

                  if host:
                      ws["headers"]["Host"] = host

                  p["ws-opts"] = ws

              return p

          def parse_ss(link):
              try:
                  u = urllib.parse.urlsplit(link)
              except Exception:
                  return None

              if not u.hostname or not u.port:
                  return None

              user = u.username or ""

              try:
                  user = urllib.parse.unquote(user)
              except Exception:
                  pass

              if ":" not in user:
                  try:
                      user = base64.urlsafe_b64decode(
                          user + "=" * (-len(user) % 4)
                      ).decode("utf-8")
                  except Exception:
                      return None

              method, password = user.split(":", 1)

              name = urllib.parse.unquote(u.fragment or "") or "SS"

              return {
                  "name": name,
                  "type": "ss",
                  "server": u.hostname,
                  "port": u.port,
                  "cipher": method,
                  "password": password,
                  "udp": True
              }

          for link in lines:
              try:
                  if link.startswith("vmess://"):
                      add_proxy(parse_vmess(link))

                  elif link.startswith("vless://"):
                      add_proxy(parse_vless(link))

                  elif link.startswith("trojan://"):
                      add_proxy(parse_trojan(link))

                  elif link.startswith("ss://"):
                      add_proxy(parse_ss(link))

              except Exception as e:
                  print("跳过节点:", str(e))

          if not proxies:
              raise SystemExit("没有成功转换任何 Clash 节点")

          config = {
              "mixed-port": 7890,
              "allow-lan": False,
              "mode": "rule",
              "log-level": "info",
              "ipv6": False,

              "dns": {
                  "enable": True,
                  "enhanced-mode": "fake-ip",
                  "nameserver": [
                      "1.1.1.1",
                      "8.8.8.8"
                  ],
                  "fallback": [
                      "1.0.0.1",
                      "8.8.4.4"
                  ]
              },

              "proxies": proxies,

              "proxy-groups": [
                  {
                      "name": "🚀 节点选择",
                      "type": "select",
                      "proxies": [
                          "⚡ 自动选择",
                          "DIRECT"
                      ] + [p["name"] for p in proxies]
                  },
                  {
                      "name": "⚡ 自动选择",
                      "type": "url-test",
                      "url": "https://www.gstatic.com/generate_204",
                      "interval": 300,
                      "tolerance": 50,
                      "proxies": [p["name"] for p in proxies]
                  }
              ],

              "rules": [
                  "DOMAIN-SUFFIX,local,DIRECT",
                  "IP-CIDR,127.0.0.0/8,DIRECT,no-resolve",
                  "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve",
                  "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve",
                  "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve",
                  "GEOIP,CN,DIRECT",
                  "MATCH,🚀 节点选择"
              ]
          }

          with open("clash.yaml", "w", encoding="utf-8") as f:
              yaml.safe_dump(
                  config,
                  f,
                  allow_unicode=True,
                  sort_keys=False,
                  default_flow_style=False
              )

          print("=" * 60)
          print("转换成功")
          print("节点数量:", len(proxies))
          print("节点名称已自动去重")
          print("=" * 60)
          PY

      - name: Check duplicate names
        run: |
          python3 <<'PY'
          import yaml
          from collections import Counter

          with open("clash.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          proxies = data.get("proxies", [])

          names = [p.get("name") for p in proxies]

          duplicates = [
              name
              for name, count in Counter(names).items()
              if count > 1
          ]

          if duplicates:
              print("发现重复节点:")
              for name in duplicates:
                  print(name)

              raise SystemExit("节点名称重复，停止发布")

          print("节点名称检查通过")
          print("节点数量:", len(proxies))
          PY

      - name: Prepare Mihomo test config
        run: |
          cp clash.yaml test.yaml

          nohup ./mihomo -d . -f test.yaml > mihomo.log 2>&1 &
          echo $! > mihomo.pid

          echo "等待 Mihomo 启动..."

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/version >/dev/null 2>&1; then
              echo "Mihomo 启动成功"
              break
            fi

            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:9090/version >/dev/null 2>&1; then
            echo "Mihomo 启动失败"
            cat mihomo.log
            exit 1
          fi

      - name: Test nodes
        run: |
          python3 <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          import yaml
          from pathlib import Path

          API = "http://127.0.0.1:9090"
          TEST_URL = "https://www.gstatic.com/generate_204"
          TIMEOUT = 5000

          with open("clash.yaml", "r", encoding="utf-8") as f:
              config = yaml.safe_load(f)

          proxies = config.get("proxies", [])

          print(f"开始测试 {len(proxies)} 个节点")
          print("=" * 70)

          alive = []
          dead = []

          for index, proxy in enumerate(proxies, 1):
              name = str(proxy.get("name", "")).strip()

              if not name:
                  continue

              encoded_name = urllib.parse.quote(name, safe="")

              query = (
                  "?url="
                  + urllib.parse.quote(TEST_URL, safe="")
                  + "&timeout="
                  + str(TIMEOUT)
                  + "&expected=204"
              )

              url = f"{API}/proxies/{encoded_name}/delay{query}"

              try:
                  with urllib.request.urlopen(url, timeout=8) as r:
                      result = json.loads(r.read().decode())

                  delay = int(result.get("delay", 0))

                  if delay > 0:
                      alive.append((name, delay))
                      print(
                          f"[{index}/{len(proxies)}] "
                          f"OK {delay:>5} ms  {name}"
                      )
                  else:
                      dead.append(name)
                      print(
                          f"[{index}/{len(proxies)}] "
                          f"TIMEOUT       {name}"
                      )

              except Exception:
                  dead.append(name)
                  print(
                      f"[{index}/{len(proxies)}] "
                      f"FAILED        {name}"
                  )

              time.sleep(0.05)

          print("=" * 70)
          print("可用节点:", len(alive))
          print("无效节点:", len(dead))

          Path("alive_nodes.json").write_text(
              json.dumps(
                  [
                      {
                          "name": name,
                          "delay": delay
                      }
                      for name, delay in alive
                  ],
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          if not alive:
              raise SystemExit("没有任何节点通过测试")
          PY

      - name: Remove invalid nodes and sort
        run: |
          python3 <<'PY'
          import json
          import yaml

          with open("alive_nodes.json", "r", encoding="utf-8") as f:
              alive = json.load(f)

          delays = {
              item["name"]: item["delay"]
              for item in alive
          }

          with open("clash.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          original = data.get("proxies", [])

          data["proxies"] = [
              p
              for p in original
              if p.get("name") in delays
          ]

          data["proxies"] = sorted(
              data["proxies"],
              key=lambda p: delays.get(
                  p.get("name"),
                  999999
              )
          )

          alive_names = {
              p["name"]
              for p in data["proxies"]
          }

          for group in data.get("proxy-groups", []):
              if group.get("name") == "🚀 节点选择":
                  group["proxies"] = [
                      "⚡ 自动选择",
                      "DIRECT"
                  ] + [
                      p["name"]
                      for p in data["proxies"]
                  ]

              elif group.get("name") == "⚡ 自动选择":
                  group["proxies"] = [
                      p["name"]
                      for p in data["proxies"]
                  ]

          with open("clash.yaml", "w", encoding="utf-8") as f:
              yaml.safe_dump(
                  data,
                  f,
                  allow_unicode=True,
                  sort_keys=False,
                  default_flow_style=False
              )

          print("原始节点:", len(original))
          print("可用节点:", len(data["proxies"]))
          print("已删除无效节点:", len(original) - len(data["proxies"]))
          PY

      - name: Final validation
        run: |
          python3 <<'PY'
          import yaml
          from collections import Counter

          with open("clash.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          proxies = data.get("proxies", [])

          if not proxies:
              raise SystemExit("最终配置没有节点")

          names = [
              p.get("name")
              for p in proxies
          ]

          duplicates = [
              name
              for name, count in Counter(names).items()
              if count > 1
          ]

          if duplicates:
              raise SystemExit(
                  "仍然存在重复节点: "
                  + ", ".join(duplicates)
              )

          print("================================")
          print("Clash YAML 检查通过")
          print("最终可用节点:", len(proxies))
          print("重复节点: 0")
          print("================================")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clash.yaml

          if git diff --cached --quiet; then
            echo "没有变化，不提交"
          else
            git commit -m "Update tested Clash nodes"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          if [ -f mihomo.pid ]; then
            kill "$(cat mihomo.pid)" 2>/dev/null || true
          fi
