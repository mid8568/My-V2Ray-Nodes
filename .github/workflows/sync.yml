name: V2Ray Ultimate Node Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq python3 python3-pip wget
          pip3 install --break-system-packages pyyaml requests

      - name: Install sing-box
        run: |
          VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.tag_name')
          VERSION=${VERSION#v}

          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz" -O sing-box.tar.gz

          tar -xzf sing-box.tar.gz

          sudo install "sing-box-${VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box

          sing-box version

      - name: Prepare files
        run: |
          mkdir -p output

          touch nodes_all.txt
          touch alive_nodes.txt
          touch result.txt
          touch nodes.txt
          touch base64.txt

      - name: Download latest ClashFree
        run: |
          python3 <<'PY'
          import requests
          import re
          import sys

          API_URL = "https://api.github.com/repos/free-nodes/clashfree/contents"

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "My-V2Ray-Nodes"
          }

          response = requests.get(
              API_URL,
              headers=headers,
              timeout=30
          )

          response.raise_for_status()

          files = response.json()

          pattern = re.compile(r"^clash\d{8}\.ya?ml$")

          candidates = []

          for item in files:
              name = item.get("name", "")

              if pattern.match(name):
                  candidates.append(name)

          if not candidates:
              print("ERROR: 没有找到 ClashFree 日期 YAML 文件")
              sys.exit(1)

          candidates.sort(reverse=True)

          latest = candidates[0]

          print("ClashFree 最新文件:", latest)

          download_url = (
              "https://raw.githubusercontent.com/"
              "free-nodes/clashfree/main/"
              + latest
          )

          print("下载地址:", download_url)

          data = requests.get(
              download_url,
              headers={
                  "User-Agent": "My-V2Ray-Nodes"
              },
              timeout=120
          )

          data.raise_for_status()

          with open(
              "clashfree.yml",
              "wb"
          ) as f:
              f.write(data.content)

          print(
              "ClashFree 下载完成:",
              len(data.content),
              "bytes"
          )
          PY

      - name: Extract ClashFree proxies
        run: |
          python3 <<'PY'
          import yaml
          import sys

          with open(
              "clashfree.yml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f) or {}

          proxies = data.get("proxies", [])

          if not isinstance(proxies, list):
              print("ERROR: ClashFree 文件没有有效 proxies")
              sys.exit(1)

          clean = []

          for proxy in proxies:
              if not isinstance(proxy, dict):
                  continue

              if not proxy.get("type"):
                  continue

              if not proxy.get("server"):
                  continue

              if not proxy.get("port"):
                  continue

              clean.append(proxy)

          with open(
              "clashfree_nodes.yml",
              "w",
              encoding="utf-8"
          ) as f:
              yaml.safe_dump(
                  {
                      "proxies": clean
                  },
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          print(
              "ClashFree 有效节点:",
              len(clean)
          )
          PY

      - name: Convert ClashFree nodes
        run: |
          python3 <<'PY'
          import yaml
          import base64

          with open(
              "clashfree_nodes.yml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f) or {}

          proxies = data.get("proxies", [])

          output = []

          for proxy in proxies:
              name = str(
                  proxy.get(
                      "name",
                      "ClashFree"
                  )
              )

              ptype = str(
                  proxy.get(
                      "type",
                      ""
                  )
              ).lower()

              server = proxy.get("server")
              port = proxy.get("port")

              if not server or not port:
                  continue

              if ptype in (
                  "ss",
                  "shadowsocks"
              ):
                  cipher = proxy.get("cipher")
                  password = proxy.get("password")

                  if cipher and password:
                      output.append(
                          f"ss://{cipher}:{password}@{server}:{port}#{name}"
                      )

              elif ptype == "trojan":
                  password = proxy.get("password")

                  if password:
                      output.append(
                          f"trojan://{password}@{server}:{port}#{name}"
                      )

              elif ptype == "vmess":
                  uuid = proxy.get("uuid")

                  if uuid:
                      output.append(
                          f"vmess://{uuid}@{server}:{port}#{name}"
                      )

              elif ptype in (
                  "http",
                  "socks5"
              ):
                  output.append(
                      f"{ptype}://{server}:{port}#{name}"
                  )

          output = list(
              dict.fromkeys(output)
          )

          with open(
              "clashfree_nodes.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(output)
              )

          print(
              "ClashFree 转换节点:",
              len(output)
          )
          PY

      - name: Merge node sources
        run: |
          cat clashfree_nodes.txt >> nodes_all.txt

          if [ -f data/links.txt ]; then

            while IFS= read -r url; do

              if [ -z "$url" ]; then
                continue
              fi

              echo "读取订阅:"
              echo "$url"

              curl -L \
                --max-time 120 \
                --retry 2 \
                --silent \
                --show-error \
                -A "Mozilla/5.0" \
                "$url" >> nodes_all.txt || true

              echo "" >> nodes_all.txt

            done < data/links.txt

          else

            echo "没有找到 data/links.txt"

          fi

          sed -i 's/\r$//' nodes_all.txt

          grep -v '^[[:space:]]*$' nodes_all.txt \
            | sort -u \
            > nodes_all.tmp || true

          mv nodes_all.tmp nodes_all.txt

          echo "合并完成"

          echo "nodes_all.txt 行数:"
          wc -l nodes_all.txt

      - name: Extract node URLs
        run: |
          python3 <<'PY'
          import base64

          protocols = (
              "vmess://",
              "vless://",
              "trojan://",
              "ss://",
              "ssr://",
              "hysteria://",
              "hysteria2://",
              "hy2://",
              "tuic://",
              "socks5://",
              "http://",
              "https://"
          )

          result = []

          with open(
              "nodes_all.txt",
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:

              for line in f:

                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith(protocols):
                      result.append(line)
                      continue

                  try:

                      padded = (
                          line
                          + "=" * (-len(line) % 4)
                      )

                      decoded = base64.b64decode(
                          padded
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      )

                      for item in decoded.splitlines():

                          item = item.strip()

                          if item.startswith(protocols):
                              result.append(item)

                  except Exception:
                      pass

          result = list(
              dict.fromkeys(result)
          )

          with open(
              "nodes.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(
                  "\n".join(result)
              )

          print(
              "标准节点数量:",
              len(result)
          )
          PY

      - name: Prepare alive nodes
        run: |
          cp nodes.txt alive_nodes.txt

          echo "当前节点数量:"
          wc -l alive_nodes.txt

      - name: Generate Clash YAML
        run: |
          python3 <<'PY'
          import yaml

          with open(
              "clashfree.yml",
              "r",
              encoding="utf-8"
          ) as f:
              source = yaml.safe_load(f) or {}

          proxies = source.get(
              "proxies",
              []
          )

          if not isinstance(
              proxies,
              list
          ):
              proxies = []

          clean = []

          seen = set()

          for proxy in proxies:

              if not isinstance(
                  proxy,
                  dict
              ):
                  continue

              server = proxy.get("server")
              port = proxy.get("port")
              ptype = proxy.get("type")

              if not server:
                  continue

              if not port:
                  continue

              if not ptype:
                  continue

              key = (
                  str(ptype),
                  str(server),
                  str(port),
                  str(proxy.get("uuid", "")),
                  str(proxy.get("password", "")),
                  str(proxy.get("cipher", ""))
              )

              if key in seen:
                  continue

              seen.add(key)

              clean.append(proxy)

          names = []

          for proxy in clean:

              name = proxy.get("name")

              if name:
                  names.append(
                      str(name)
                  )

          config = {
              "mixed-port": 7890,

              "allow-lan": False,

              "mode": "rule",

              "log-level": "info",

              "proxies": clean,

              "proxy-groups": [
                  {
                      "name": "🚀 节点选择",

                      "type": "select",

                      "proxies": [
                          "♻️ 自动选择",
                          "DIRECT"
                      ] + names
                  },

                  {
                      "name": "♻️ 自动选择",

                      "type": "url-test",

                      "url": "http://www.gstatic.com/generate_204",

                      "interval": 300,

                      "tolerance": 50,

                      "proxies": names
                  }
              ],

              "rules": [
                  "MATCH,🚀 节点选择"
              ]
          }

          with open(
              "clash.yaml",
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  config,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          print(
              "Clash YAML 节点数量:",
              len(clean)
          )
          PY

      - name: Generate Base64
        run: |
          base64 -w 0 nodes.txt > base64.txt
          echo >> base64.txt

      - name: Generate result
        run: |
          {
            echo "My-V2Ray-Nodes"
            echo
            echo "Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Total nodes:"
            wc -l < nodes.txt
            echo
            echo "ClashFree source:"
            echo "https://github.com/free-nodes/clashfree"
          } > result.txt

      - name: Save source information
        run: |
          {
            echo "ClashFree"
            echo "https://github.com/free-nodes/clashfree"
            echo
            echo "Updated:"
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          } > output/source.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            nodes_all.txt \
            alive_nodes.txt \
            result.txt \
            nodes.txt \
            base64.txt \
            clash.yaml \
            output/source.txt

          if git diff --cached --quiet; then
            echo "没有新的变化"
          else
            git commit -m "Auto update nodes"
            git push
          fi
