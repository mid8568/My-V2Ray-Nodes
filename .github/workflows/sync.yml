name: V2Ray Ultimate Node Sync

on:

  workflow_dispatch:

  schedule:
    - cron: "0 */4 * * *"


permissions:
  contents: write


jobs:

  sync:

    runs-on: ubuntu-latest


    steps:


      # ==========================================
      # 1. Checkout
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v6


      # ==========================================
      # 2. Install Dependencies
      # ==========================================

      - name: Install Dependencies
        run: |

          set -e

          sudo apt update -qq

          sudo apt install -y \
            jq \
            curl \
            wget \
            unzip \
            python3 \
            python3-pip

          python3 -m pip install --break-system-packages pyyaml


      # ==========================================
      # 3. Install sing-box
      # ==========================================

      - name: Install sing-box
        run: |

          set -e

          echo "正在获取 sing-box 最新版本..."

          URL=$(curl -fsSL \
            https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | jq -r '
              .assets[]
              | select(
                  .name
                  | contains("linux-amd64.tar.gz")
                )
              | .browser_download_url
            ' \
            | head -1)


          echo "下载地址:"
          echo "$URL"


          if [ -z "$URL" ] || [ "$URL" = "null" ]; then

            echo "无法获取 sing-box 下载地址"

            exit 1

          fi


          wget -q \
            "$URL" \
            -O sing.tar.gz


          echo "解压 sing-box..."

          tar -xf sing.tar.gz


          mv sing-box-*/sing-box sing-box

          chmod +x sing-box


          echo "sing-box 安装完成"


      # ==========================================
      # 4. Check sing-box
      # ==========================================

      - name: sing-box version
        run: |

          ./sing-box version


      # ==========================================
      # 5. Download Sources
      # ==========================================

      - name: Download Sources
        run: |

          set -e


          rm -f raw.txt
          rm -f nodes_all.txt


          touch raw.txt
          touch nodes_all.txt


          # ======================================
          # 节点源
          # ======================================

          sources=(

            "https://www.xrayvip.com/free.txt"

            "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt"

            "https://raw.githubusercontent.com/rtwo2/FastNodes/main/sub/top.txt"

          )


          echo ""
          echo "=========================================="
          echo "开始下载节点源"
          echo "=========================================="


          total_sources=0
          success_sources=0


          for url in "${sources[@]}"; do

            total_sources=$((total_sources + 1))


            echo ""
            echo "------------------------------------------"
            echo "正在下载:"
            echo "$url"
            echo "------------------------------------------"


            tmp_file=$(mktemp)


            if curl \
              -L \
              --connect-timeout 15 \
              --max-time 120 \
              --retry 3 \
              --retry-delay 2 \
              --fail \
              -sS \
              "$url" \
              -o "$tmp_file"
            then

              size=$(wc -c < "$tmp_file")


              echo "下载成功"
              echo "文件大小: ${size} bytes"


              if [ "$size" -gt 0 ]; then

                cat "$tmp_file" >> raw.txt

                echo "" >> raw.txt

                success_sources=$((success_sources + 1))

              else

                echo "警告：源返回空内容"

              fi

            else

              echo "下载失败:"
              echo "$url"

            fi


            rm -f "$tmp_file"

          done


          echo ""
          echo "=========================================="
          echo "下载完成"
          echo "=========================================="


          echo "源总数:"
          echo "$total_sources"


          echo "成功源数量:"
          echo "$success_sources"


          echo ""
          echo "raw.txt 大小:"

          wc -c raw.txt


          if [ ! -s raw.txt ]; then

            echo ""
            echo "错误：所有节点源都是空的"
            echo "raw.txt 没有任何内容"

            exit 1

          fi


      # ==========================================
      # 6. Extract Nodes
      # ==========================================

      - name: Extract Nodes
        run: |

          set -e


          python3 <<'PY'

          import re
          import base64


          # ======================================
          # 读取原始数据
          # ======================================

          with open(
              "raw.txt",
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:

              data = f.read()


          print(
              "raw.txt 字符数:",
              len(data)
          )


          # ======================================
          # 清理 HTML
          # ======================================

          data = data.replace(
              "&amp;",
              "&"
          )

          data = data.replace(
              "\r",
              ""
          )


          # ======================================
          # 直接提取节点
          # ======================================

          patterns = [

              r'vmess://[^\s<>"\']+',

              r'vless://[^\s<>"\']+',

              r'trojan://[^\s<>"\']+',

              r'ss://[^\s<>"\']+',

              r'hy2://[^\s<>"\']+',

              r'hysteria2://[^\s<>"\']+',

          ]


          nodes = []


          for pattern in patterns:

              found = re.findall(
                  pattern,
                  data,
                  flags=re.IGNORECASE
              )

              nodes.extend(found)


          print(
              "直接提取节点:",
              len(nodes)
          )


          # ======================================
          # Base64 解码
          # ======================================

          decoded_nodes = []


          for line in data.splitlines():

              line = line.strip()


              if not line:
                  continue


              if re.match(
                  r'^(vmess|vless|trojan|ss|hy2|hysteria2)://',
                  line,
                  re.IGNORECASE
              ):
                  continue


              if len(line) < 20:
                  continue


              try:

                  padding = "=" * (
                      (-len(line)) % 4
                  )


                  decoded = base64.b64decode(
                      line + padding,
                      validate=False
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )


                  if any(
                      x in decoded
                      for x in [
                          "vmess://",
                          "vless://",
                          "trojan://",
                          "ss://",
                          "hy2://",
                          "hysteria2://"
                      ]
                  ):

                      decoded_nodes.append(
                          decoded
                      )


              except Exception:

                  pass


          print(
              "Base64 解码得到文本:",
              len(decoded_nodes)
          )


          # ======================================
          # 从 Base64 解码结果继续提取
          # ======================================

          for decoded in decoded_nodes:

              for pattern in patterns:

                  found = re.findall(
                      pattern,
                      decoded,
                      flags=re.IGNORECASE
                  )

                  nodes.extend(found)


          # ======================================
          # 清理节点
          # ======================================

          clean = []


          for node in nodes:

              node = node.strip()

              node = node.replace(
                  "\r",
                  ""
              )

              node = node.replace(
                  "&amp;",
                  "&"
              )

              node = node.rstrip(
                  "\"'<>"
              )


              if node:

                  clean.append(
                      node
                  )


          # ======================================
          # 去重
          # ======================================

          clean = list(
              dict.fromkeys(clean)
          )


          # ======================================
          # 保存
          # ======================================

          with open(
              "nodes_all.txt",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "\n".join(clean)
              )


          print("")
          print(
              "================================"
          )
          print(
              "最终节点数量:",
              len(clean)
          )
          print(
              "================================"
          )


          if len(clean) == 0:

              print("")
              print(
                  "错误：没有提取到任何节点"
              )

              print("请检查 raw.txt 是否包含节点")

              raise SystemExit(1)

          PY


          echo ""
          echo "nodes_all.txt:"
          wc -l nodes_all.txt


          echo ""
          echo "前 10 个节点:"

          head -10 nodes_all.txt


      # ==========================================
      # 7. TCP Fast Filter
      # ==========================================

      - name: TCP Fast Filter
        timeout-minutes: 15
        run: |

          chmod +x tcp_filter.py

          echo "开始 TCP 快速检测..."

          python3 -u tcp_filter.py


      # ==========================================
      # 8. Check Alive Nodes
      # ==========================================

      - name: Check Alive Nodes
        run: |

          echo ""
          echo "=========================================="
          echo "TCP 筛选结果"
          echo "=========================================="


          if [ -f alive_nodes.txt ]; then

            echo "alive节点数量:"

            wc -l alive_nodes.txt


            echo ""
            echo "前 5 个:"

            head -5 alive_nodes.txt

          else

            echo "错误：alive_nodes.txt 不存在"

            exit 1

          fi


      # ==========================================
      # 9. Sing-box Real Test
      # ==========================================

      - name: Sing-box Real Test
        timeout-minutes: 45
        run: |

          chmod +x test_nodes.py

          echo ""
          echo "=========================================="
          echo "开始 sing-box 实际测速"
          echo "=========================================="


          python3 -u test_nodes.py


      # ==========================================
      # 10. Check Result
      # ==========================================

      - name: Check Result
        run: |

          echo ""
          echo "=========================================="
          echo "测速结果"
          echo "=========================================="


          if [ -f result.txt ]; then

            echo "测速成功节点数量:"

            wc -l result.txt


            echo ""
            echo "前 20 个:"

            head -20 result.txt

          else

            echo "错误：result.txt 不存在"

            exit 1

          fi


      # ==========================================
      # 11. Debug
      # ==========================================

      - name: Debug Result
        run: |

          echo ""
          echo "=========================================="
          echo "Debug"
          echo "=========================================="


          echo ""
          echo "nodes_all:"

          wc -l nodes_all.txt || true


          echo ""
          echo "alive_nodes:"

          wc -l alive_nodes.txt || true


          echo ""
          echo "result:"

          wc -l result.txt || true


          echo ""
          echo "result内容:"

          head -20 result.txt || true


      # ==========================================
      # 12. Generate Nodes
      # ==========================================

      - name: Generate Nodes
        run: |

          set -e


          if [ ! -s result.txt ]; then

            echo ""
            echo "没有测速成功节点"

            exit 1

          fi


          echo ""
          echo "=========================================="
          echo "生成最终节点"
          echo "=========================================="


          # result.txt 格式:
          #
          # 延迟|节点
          #
          # 例如:
          #
          # 120|vless://xxxxx
          #
          # 按延迟从低到高排序


          sort \
            -t '|' \
            -k1,1n \
            result.txt \
          | head -300 \
          | cut -d '|' -f2- \
          > nodes.txt


          # 删除空行

          sed -i '/^[[:space:]]*$/d' nodes.txt


          echo ""
          echo "最终节点数量:"

          wc -l nodes.txt


          if [ ! -s nodes.txt ]; then

            echo "错误：nodes.txt 为空"

            exit 1

          fi


      # ==========================================
      # 13. Generate Base64
      # ==========================================

      - name: Generate Base64
        run: |

          echo "生成 Base64 订阅..."


          base64 \
            -w 0 \
            nodes.txt \
            > base64.txt


          echo ""
          echo "base64.txt 大小:"

          wc -c base64.txt


          if [ ! -s base64.txt ]; then

            echo "错误：base64.txt 为空"

            exit 1

          fi


      # ==========================================
      # 14. Generate Clash Mi Config
      # ==========================================

      - name: Generate Clash Mi Config
        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "生成 Clash Mi 配置"
          echo "=========================================="


          python3 <<'PY'

          import base64
          import json
          import urllib.parse
          import yaml


          INPUT = "nodes.txt"

          OUTPUT = "clash.yaml"


          proxies = []


          with open(
              INPUT,
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:

              nodes = [
                  x.strip()
                  for x in f
                  if x.strip()
              ]


          print(
              "读取节点:",
              len(nodes)
          )


          # ======================================
          # VMess
          # ======================================

          def decode_vmess(uri):

              try:

                  raw = uri[8:]

                  raw += "=" * (
                      -len(raw) % 4
                  )


                  data = base64.b64decode(
                      raw
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )


                  return json.loads(data)


              except Exception:

                  return None


          def add_vmess(uri, index):

              data = decode_vmess(uri)


              if not data:
                  return


              server = data.get("add")

              port = data.get("port")

              uuid = data.get("id")


              if not server or not port or not uuid:
                  return


              try:

                  port = int(port)

              except:

                  return


              name = (
                  data.get("ps")
                  or f"VMess-{index}"
              )


              proxy = {

                  "name": name,

                  "type": "vmess",

                  "server": server,

                  "port": port,

                  "uuid": uuid,

                  "alterId": int(
                      data.get(
                          "aid",
                          0
                      )
                  ),

                  "cipher": data.get(
                      "scy",
                      "auto"
                  )

              }


              network = data.get(
                  "net"
              )


              if network:

                  proxy["network"] = network


              # WebSocket

              if network == "ws":

                  ws_opts = {}


                  path = data.get(
                      "path"
                  )

                  host = data.get(
                      "host"
                  )


                  if path:

                      ws_opts[
                          "path"
                      ] = path


                  if host:

                      ws_opts[
                          "headers"
                      ] = {
                          "Host": host
                      }


                  if ws_opts:

                      proxy[
                          "ws-opts"
                      ] = ws_opts


              # TLS

              tls = str(
                  data.get(
                      "tls",
                      ""
                  )
              ).lower()


              if tls in [
                  "tls",
                  "true",
                  "1"
              ]:

                  proxy["tls"] = True


                  sni = data.get(
                      "sni"
                  )


                  if sni:

                      proxy[
                          "servername"
                      ] = sni


              proxies.append(
                  proxy
              )


          # ======================================
          # VLESS
          # ======================================

          def add_vless(uri, index):

              try:

                  u = urllib.parse.urlparse(
                      uri
                  )


                  uuid = u.username

                  server = u.hostname

                  port = u.port


                  if not uuid or not server or not port:
                      return


                  params = urllib.parse.parse_qs(
                      u.query
                  )


                  name = (
                      urllib.parse.unquote(
                          u.fragment
                      )
                      or f"VLESS-{index}"
                  )


                  proxy = {

                      "name": name,

                      "type": "vless",

                      "server": server,

                      "port": port,

                      "uuid": uuid,

                      "network": params.get(
                          "type",
                          ["tcp"]
                      )[0]

                  }


                  security = params.get(
                      "security",
                      [""]
                  )[0]


                  if security == "tls":

                      proxy["tls"] = True


                  if security == "reality":

                      proxy["tls"] = True

                      proxy[
                          "reality-opts"
                      ] = {

                          "public-key":
                              params.get(
                                  "pbk",
                                  [""]
                              )[0],

                          "short-id":
                              params.get(
                                  "sid",
                                  [""]
                              )[0]

                      }


                  sni = params.get(
                      "sni",
                      [None]
                  )[0]


                  if sni:

                      proxy[
                          "servername"
                      ] = sni


                  flow = params.get(
                      "flow",
                      [None]
                  )[0]


                  if flow:

                      proxy[
                          "flow"
                      ] = flow


                  # WebSocket

                  if proxy[
                      "network"
                  ] == "ws":

                      path = params.get(
                          "path",
                          ["/"]
                      )[0]


                      host = params.get(
                          "host",
                          [None]
                      )[0]


                      proxy[
                          "ws-opts"
                      ] = {

                          "path": path

                      }


                      if host:

                          proxy[
                              "ws-opts"
                          ][
                              "headers"
                          ] = {

                              "Host": host

                          }


                  proxies.append(
                      proxy
                  )


              except Exception:

                  pass


          # ======================================
          # Trojan
          # ======================================

          def add_trojan(uri, index):

              try:

                  u = urllib.parse.urlparse(
                      uri
                  )


                  password = u.username

                  server = u.hostname

                  port = u.port


                  if not password or not server or not port:
                      return


                  params = urllib.parse.parse_qs(
                      u.query
                  )


                  name = (
                      urllib.parse.unquote(
                          u.fragment
                      )
                      or f"Trojan-{index}"
                  )


                  proxy = {

                      "name": name,

                      "type": "trojan",

                      "server": server,

                      "port": port,

                      "password": password

                  }


                  sni = params.get(
                      "sni",
                      [None]
                  )[0]


                  if sni:

                      proxy[
                          "sni"
                      ] = sni


                  network = params.get(
                      "type",
                      ["tcp"]
                  )[0]


                  if network == "ws":

                      proxy[
                          "network"
                      ] = "ws"


                      proxy[
                          "ws-opts"
                      ] = {

                          "path":
                              params.get(
                                  "path",
                                  ["/"]
                              )[0]

                      }


                      host = params.get(
                          "host",
                          [None]
                      )[0]


                      if host:

                          proxy[
                              "ws-opts"
                          ][
                              "headers"
                          ] = {

                              "Host": host

                          }


                  proxies.append(
                      proxy
                  )


              except Exception:

                  pass


          # ======================================
          # Shadowsocks
          # ======================================

          def add_ss(uri, index):

              try:

                  u = urllib.parse.urlparse(
                      uri
                  )


                  server = u.hostname

                  port = u.port


                  if not server or not port:
                      return


                  # ss://BASE64(method:password)@server:port

                  userinfo = (
                      urllib.parse.unquote(
                          u.username or ""
                      )
                  )


                  if not userinfo:

                      return


                  try:

                      decoded = base64.b64decode(
                          userinfo +
                          "=" * (
                              -len(userinfo) % 4
                          )
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      )

                  except:

                      decoded = userinfo


                  if ":" not in decoded:

                      return


                  method, password = decoded.split(
                      ":",
                      1
                  )


                  name = (
                      urllib.parse.unquote(
                          u.fragment
                      )
                      or f"SS-{index}"
                  )


                  proxy = {

                      "name": name,

                      "type": "ss",

                      "server": server,

                      "port": port,

                      "cipher": method,

                      "password": password

                  }


                  proxies.append(
                      proxy
                  )


              except Exception:

                  pass


          # ======================================
          # Hysteria2
          # ======================================

          def add_hy2(uri, index):

              try:

                  u = urllib.parse.urlparse(
                      uri
                  )


                  password = u.username

                  server = u.hostname

                  port = u.port


                  if not server:

                      return


                  params = urllib.parse.parse_qs(
                      u.query
                  )


                  proxy = {

                      "name":
                          urllib.parse.unquote(
                              u.fragment
                          )
                          or f"Hysteria2-{index}",

                      "type": "hysteria2",

                      "server": server,

                      "port": port or 443,

                      "password":
                          password or ""

                  }


                  sni = params.get(
                      "sni",
                      [None]
                  )[0]


                  if sni:

                      proxy[
                          "sni"
                      ] = sni


                  insecure = params.get(
                      "insecure",
                      ["0"]
                  )[0]


                  if insecure in [
                      "1",
                      "true"
                  ]:

                      proxy[
                          "skip-cert-verify"
                      ] = True


                  proxies.append(
                      proxy
                  )


              except Exception:

                  pass


          # ======================================
          # Parse Nodes
          # ======================================

          for index, node in enumerate(
              nodes,
              1
          ):

              try:

                  if node.startswith(
                      "vmess://"
                  ):

                      add_vmess(
                          node,
                          index
                      )


                  elif node.startswith(
                      "vless://"
                  ):

                      add_vless(
                          node,
                          index
                      )


                  elif node.startswith(
                      "trojan://"
                  ):

                      add_trojan(
                          node,
                          index
                      )


                  elif node.startswith(
                      "ss://"
                  ):

                      add_ss(
                          node,
                          index
                      )


                  elif (
                      node.startswith(
                          "hy2://"
                      )
                      or
                      node.startswith(
                          "hysteria2://"
                      )
                  ):

                      add_hy2(
                          node,
                          index
                      )


              except Exception as e:

                  print(
                      "节点转换失败:",
                      str(e)
                  )


          # ======================================
          # 去重
          # ======================================

          unique = []

          seen = set()


          for proxy in proxies:

              key = (

                  proxy.get(
                      "type"
                  ),

                  proxy.get(
                      "server"
                  ),

                  proxy.get(
                      "port"
                  ),

                  proxy.get(
                      "uuid"
                  ),

                  proxy.get(
                      "password"
                  )

              )


              if key in seen:

                  continue


              seen.add(
                  key
              )


              unique.append(
                  proxy
              )


          proxies = unique


          print("")
          print(
              "=========================================="
          )

          print(
              "成功转换 Clash 节点:",
              len(proxies)
          )

          print(
              "=========================================="
          )


          if len(proxies) == 0:

              print(
                  "错误：没有生成任何 Clash 节点"
              )

              raise SystemExit(1)


          # ======================================
          # Proxy Names
          # ======================================

          proxy_names = [
              proxy["name"]
              for proxy in proxies
          ]


          # ======================================
          # Clash Config
          # ======================================

          config = {

              "mixed-port": 7890,

              "allow-lan": True,

              "mode": "rule",

              "log-level": "info",

              "ipv6": False,


              "proxies": proxies,


              "proxy-groups": [

                  {

                      "name": "🚀 节点选择",

                      "type": "select",

                      "proxies": [

                          "♻️ 自动选择",

                          *proxy_names,

                          "DIRECT"

                      ]

                  },


                  {

                      "name": "♻️ 自动选择",

                      "type": "url-test",

                      "url":
                          "http://www.gstatic.com/generate_204",

                      "interval": 300,

                      "tolerance": 50,

                      "timeout": 5000,

                      "lazy": True,

                      "proxies":
                          proxy_names

                  }

              ],


              "rules": [

                  "MATCH,🚀 节点选择"

              ]

          }


          # ======================================
          # Write YAML
          # ======================================

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  config,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )


          print("")
          print(
              "Clash 配置生成完成:"
          )

          print(
              OUTPUT
          )


          PY


          echo ""
          echo "=========================================="
          echo "Clash YAML 检查"
          echo "=========================================="


          test -s clash.yaml


          echo ""
          echo "clash.yaml 大小:"

          wc -c clash.yaml


          echo ""
          echo "Clash 节点数量:"

          grep -c '^  - name:' clash.yaml || true


          echo ""
          echo "Clash 配置前 50 行:"

          head -50 clash.yaml


      # ==========================================
      # 15. Validate Clash Config
      # ==========================================

      - name: Validate Clash Config
        run: |

          set -e


          echo ""
          echo "=========================================="
          echo "验证 Clash YAML"
          echo "=========================================="


          python3 <<'PY'

          import yaml


          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:

              config = yaml.safe_load(f)


          if not isinstance(
              config,
              dict
          ):

              raise SystemExit(
                  "clash.yaml 不是有效 YAML"
              )


          if "proxies" not in config:

              raise SystemExit(
                  "clash.yaml 缺少 proxies"
              )


          if not config["proxies"]:

              raise SystemExit(
                  "clash.yaml 的 proxies 为空"
              )


          print(
              "YAML 验证成功"
          )


          print(
              "节点数量:",
              len(
                  config["proxies"]
              )
          )


          print(
              "代理组数量:",
              len(
                  config.get(
                      "proxy-groups",
                      []
                  )
              )
          )

          PY


      # ==========================================
      # 16. Show Result
      # ==========================================

      - name: Show Result
        run: |

          echo ""
          echo "=========================================="
          echo "最终结果"
          echo "=========================================="


          echo ""
          echo "测速成功数量:"

          wc -l result.txt


          echo ""
          echo "最终节点数量:"

          wc -l nodes.txt


          echo ""
          echo "Base64 文件大小:"

          wc -c base64.txt


          echo ""
          echo "Clash YAML 大小:"

          wc -c clash.yaml


          echo ""
          echo "Clash 节点数量:"

          grep -c '^  - name:' clash.yaml || true


          echo ""
          echo "前 10 个节点:"

          head -10 nodes.txt


      # ==========================================
      # 17. Commit
      # ==========================================

      - name: Commit
        run: |

          set -e


          git config \
            user.name \
            "github-actions"


          git config \
            user.email \
            "github-actions@github.com"


          git add \
            nodes.txt \
            base64.txt \
            result.txt \
            clash.yaml


          if git diff \
            --cached \
            --quiet
          then

            echo ""
            echo "没有新的节点变化"

            exit 0

          fi


          git commit \
            -m "Ultimate node update: $(date '+%Y-%m-%d %H:%M:%S')"


          git push
