name: V2Ray Ultimate Node Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq python3 python3-yaml gzip

      - name: Download Mihomo
        shell: bash
        run: |
          set -e

          URL=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-compatible-.*\\.gz$")) | .browser_download_url' \
            | head -n 1)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "无法找到 Mihomo Linux amd64 compatible 版本"
            exit 1
          fi

          echo "下载 Mihomo:"
          echo "$URL"

          curl -fL "$URL" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo

          ./mihomo -v

      - name: Download V2Ray subscriptions
        shell: bash
        run: |
          set -e

          echo "下载 XrayVIP..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 120 \
            "https://www.xrayvip.com/free.txt" \
            -o source1.txt

          echo "下载 ZRFME..."

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 20 \
            --max-time 120 \
            "https://d.zrfme.com/vless-base64" \
            -o source2.txt

          test -s source1.txt
          test -s source2.txt

          echo "XrayVIP 文件大小:"
          wc -c source1.txt

          echo "ZRFME 文件大小:"
          wc -c source2.txt

      - name: Convert V2Ray to Clash
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          import json
          import re
          import urllib.parse
          import yaml
          from pathlib import Path

          texts = []

          for filename in ("source1.txt", "source2.txt"):
              path = Path(filename)

              if not path.exists():
                  continue

              text = path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              ).strip()

              if text:
                  texts.append(text)

          if not texts:
              raise SystemExit("两个订阅都没有内容")

          print("读取订阅数量:", len(texts))

          def b64decode_text(value):
              value = re.sub(r"\s+", "", value)

              candidates = [
                  value,
                  value.replace("-", "+").replace("_", "/")
              ]

              for item in candidates:
                  try:
                      item += "=" * (-len(item) % 4)

                      result = base64.b64decode(
                          item,
                          validate=False
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      ).strip()

                      if "://" in result:
                          return result

                  except Exception:
                      pass

              return ""

          links = []

          for text in texts:
              decoded = b64decode_text(text)

              content = decoded if "://" in decoded else text

              for line in content.splitlines():
                  line = line.strip()

                  if not line:
                      continue

                  if "://" in line:
                      links.append(line)

          print("解析到链接数量:", len(links))

          if not links:
              raise SystemExit("没有解析到任何 V2Ray 节点")

          proxies = []
          used_names = set()

          def unique_name(name):
              name = str(name or "").strip()

              if not name:
                  name = f"Node {len(proxies) + 1}"

              name = (
                  name
                  .replace("\n", " ")
                  .replace("\r", " ")
                  .strip()
              )

              if name not in used_names:
                  used_names.add(name)
                  return name

              number = 2

              while f"{name} {number}" in used_names:
                  number += 1

              final_name = f"{name} {number}"

              used_names.add(final_name)

              return final_name

          def add_proxy(proxy):
              if not proxy:
                  return

              proxy["name"] = unique_name(
                  proxy.get("name")
              )

              proxies.append(proxy)

          def to_int(value, default=0):
              try:
                  return int(value)
              except Exception:
                  return default

          def parse_vmess(link):
              try:
                  raw = link[len("vmess://"):].strip()

                  raw += "=" * (-len(raw) % 4)

                  obj = json.loads(
                      base64.b64decode(raw).decode(
                          "utf-8",
                          errors="ignore"
                      )
                  )
              except Exception:
                  return None

              server = obj.get("add")
              port = to_int(obj.get("port"))
              uuid = obj.get("id")

              if not server or not port or not uuid:
                  return None

              proxy = {
                  "name": (
                      obj.get("ps")
                      or obj.get("remark")
                      or "VMess"
                  ),
                  "type": "vmess",
                  "server": server,
                  "port": port,
                  "uuid": uuid,
                  "alterId": to_int(
                      obj.get("aid"),
                      0
                  ),
                  "cipher": (
                      obj.get("scy")
                      or "auto"
                  ),
                  "udp": True
              }

              tls = str(
                  obj.get("tls", "")
              ).lower()

              if tls == "tls":
                  proxy["tls"] = True

              network = obj.get("net", "")

              if network == "ws":
                  proxy["network"] = "ws"

                  ws_opts = {
                      "path": (
                          obj.get("path")
                          or "/"
                      ),
                      "headers": {}
                  }

                  host = obj.get("host")

                  if host:
                      ws_opts["headers"]["Host"] = host

                  proxy["ws-opts"] = ws_opts

              elif network == "grpc":
                  proxy["network"] = "grpc"

                  proxy["grpc-opts"] = {
                      "grpc-service-name": (
                          obj.get("path")
                          or obj.get("serviceName")
                          or ""
                      )
                  }

              elif network == "h2":
                  proxy["network"] = "h2"

                  proxy["h2-opts"] = {
                      "path": (
                          obj.get("path")
                          or "/"
                      )
                  }

              return proxy

          def parse_vless(link):
              try:
                  url = urllib.parse.urlsplit(link)

                  query = urllib.parse.parse_qs(
                      url.query
                  )

              except Exception:
                  return None

              uuid = urllib.parse.unquote(
                  url.username or ""
              )

              server = url.hostname

              try:
                  port = url.port
              except Exception:
                  port = None

              if not uuid or not server or not port:
                  return None

              name = urllib.parse.unquote(
                  url.fragment or ""
              )

              if not name:
                  name = "VLESS"

              proxy = {
                  "name": name,
                  "type": "vless",
                  "server": server,
                  "port": port,
                  "uuid": uuid,
                  "udp": True
              }

              encryption = query.get(
                  "encryption",
                  ["none"]
              )[0]

              if encryption:
                  proxy["encryption"] = encryption

              flow = query.get(
                  "flow",
                  [""]
              )[0]

              if flow:
                  proxy["flow"] = flow

              security = query.get(
                  "security",
                  [""]
              )[0]

              if security in (
                  "tls",
                  "reality"
              ):
                  proxy["tls"] = True

              sni = query.get(
                  "sni",
                  [""]
              )[0]

              if sni:
                  proxy["servername"] = sni

              fingerprint = query.get(
                  "fp",
                  [""]
              )[0]

              if fingerprint:
                  proxy[
                      "client-fingerprint"
                  ] = fingerprint

              if security == "reality":
                  public_key = query.get(
                      "pbk",
                      [""]
                  )[0]

                  short_id = query.get(
                      "sid",
                      [""]
                  )[0]

                  reality = {}

                  if public_key:
                      reality[
                          "public-key"
                      ] = public_key

                  if short_id:
                      reality[
                          "short-id"
                      ] = short_id

                  if reality:
                      proxy[
                          "reality-opts"
                      ] = reality

              network = query.get(
                  "type",
                  ["tcp"]
              )[0]

              if network == "ws":
                  proxy["network"] = "ws"

                  ws_opts = {
                      "path": query.get(
                          "path",
                          ["/"]
                      )[0],
                      "headers": {}
                  }

                  host = query.get(
                      "host",
                      [""]
                  )[0]

                  if host:
                      ws_opts[
                          "headers"
                      ]["Host"] = host

                  proxy[
                      "ws-opts"
                  ] = ws_opts

              elif network == "grpc":
                  proxy["network"] = "grpc"

                  proxy[
                      "grpc-opts"
                  ] = {
                      "grpc-service-name": query.get(
                          "serviceName",
                          [""]
                      )[0]
                  }

              elif network == "h2":
                  proxy["network"] = "h2"

                  proxy[
                      "h2-opts"
                  ] = {
                      "path": query.get(
                          "path",
                          ["/"]
                      )[0]
                  }

              return proxy

          def parse_trojan(link):
              try:
                  url = urllib.parse.urlsplit(link)

                  query = urllib.parse.parse_qs(
                      url.query
                  )

              except Exception:
                  return None

              password = urllib.parse.unquote(
                  url.username or ""
              )

              if (
                  not password
                  or not url.hostname
                  or not url.port
              ):
                  return None

              name = urllib.parse.unquote(
                  url.fragment or ""
              )

              if not name:
                  name = "Trojan"

              proxy = {
                  "name": name,
                  "type": "trojan",
                  "server": url.hostname,
                  "port": url.port,
                  "password": password,
                  "udp": True
              }

              sni = query.get(
                  "sni",
                  [""]
              )[0]

              if sni:
                  proxy["sni"] = sni

              network = query.get(
                  "type",
                  ["tcp"]
              )[0]

              if network == "ws":
                  proxy["network"] = "ws"

                  ws_opts = {
                      "path": query.get(
                          "path",
                          ["/"]
                      )[0],
                      "headers": {}
                  }

                  host = query.get(
                      "host",
                      [""]
                  )[0]

                  if host:
                      ws_opts[
                          "headers"
                      ]["Host"] = host

                  proxy[
                      "ws-opts"
                  ] = ws_opts

              return proxy

          def parse_ss(link):
              try:
                  url = urllib.parse.urlsplit(
                      link
                  )
              except Exception:
                  return None

              if not url.hostname or not url.port:
                  return None

              user = urllib.parse.unquote(
                  url.username or ""
              )

              if ":" not in user:
                  try:
                      user = base64.urlsafe_b64decode(
                          user
                          + "=" * (
                              -len(user) % 4
                          )
                      ).decode(
                          "utf-8"
                      )
                  except Exception:
                      return None

              try:
                  method, password = user.split(
                      ":",
                      1
                  )
              except Exception:
                  return None

              name = urllib.parse.unquote(
                  url.fragment or ""
              )

              if not name:
                  name = "SS"

              return {
                  "name": name,
                  "type": "ss",
                  "server": url.hostname,
                  "port": url.port,
                  "cipher": method,
                  "password": password,
                  "udp": True
              }

          for link in links:
              try:
                  if link.startswith(
                      "vmess://"
                  ):
                      add_proxy(
                          parse_vmess(link)
                      )

                  elif link.startswith(
                      "vless://"
                  ):
                      add_proxy(
                          parse_vless(link)
                      )

                  elif link.startswith(
                      "trojan://"
                  ):
                      add_proxy(
                          parse_trojan(link)
                      )

                  elif link.startswith(
                      "ss://"
                  ):
                      add_proxy(
                          parse_ss(link)
                      )

              except Exception as e:
                  print(
                      "跳过节点:",
                      str(e)
                  )

          if not proxies:
              raise SystemExit(
                  "没有成功转换任何节点"
              )

          config = {
              "mixed-port": 7890,
              "allow-lan": False,
              "mode": "rule",
              "log-level": "info",
              "ipv6": False,

              "dns": {
                  "enable": True,
                  "enhanced-mode": "fake-ip",
                  "nameserver": [
                      "1.1.1.1",
                      "8.8.8.8"
                  ],
                  "fallback": [
                      "1.0.0.1",
                      "8.8.4.4"
                  ]
              },

              "proxies": proxies,

              "proxy-groups": [
                  {
                      "name": "🚀 节点选择",
                      "type": "select",
                      "proxies": [
                          "⚡ 自动选择",
                          "DIRECT"
                      ] + [
                          p["name"]
                          for p in proxies
                      ]
                  },
                  {
                      "name": "⚡ 自动选择",
                      "type": "url-test",
                      "url": "https://www.gstatic.com/generate_204",
                      "interval": 300,
                      "tolerance": 50,
                      "proxies": [
                          p["name"]
                          for p in proxies
                      ]
                  }
              ],

              "rules": [
                  "DOMAIN-SUFFIX,local,DIRECT",
                  "IP-CIDR,127.0.0.0/8,DIRECT,no-resolve",
                  "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve",
                  "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve",
                  "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve",
                  "GEOIP,CN,DIRECT",
                  "MATCH,🚀 节点选择"
              ]
          }

          with open(
              "clash.yaml",
              "w",
              encoding="utf-8"
          ) as f:
              yaml.safe_dump(
                  config,
                  f,
                  allow_unicode=True,
                  sort_keys=False,
                  default_flow_style=False
              )

          print("=" * 60)
          print("转换完成")
          print("节点数量:", len(proxies))
          print("节点名称自动去重")
          print("=" * 60)
          PY

      - name: Check duplicate names
        run: |
          python3 <<'PY'
          import yaml
          from collections import Counter

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f)

          proxies = data.get(
              "proxies",
              []
          )

          names = [
              p.get("name")
              for p in proxies
          ]

          duplicates = [
              name
              for name, count in Counter(
                  names
              ).items()
              if count > 1
          ]

          if duplicates:
              print("重复节点:")

              for name in duplicates:
                  print(name)

              raise SystemExit(
                  "节点名称重复"
              )

          print(
              "节点名称检查通过"
          )

          print(
              "节点数量:",
              len(proxies)
          )
          PY

      - name: Prepare Mihomo test config
        run: |
          python3 <<'PY'
          import yaml

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f)

          data[
              "external-controller"
          ] = "127.0.0.1:9090"

          data["secret"] = ""

          with open(
              "test.yaml",
              "w",
              encoding="utf-8"
          ) as f:
              yaml.safe_dump(
                  data,
                  f,
                  allow_unicode=True,
                  sort_keys=False,
                  default_flow_style=False
              )
          PY

          echo "启动 Mihomo..."

          nohup ./mihomo \
            -d . \
            -f test.yaml \
            > mihomo.log 2>&1 &

          echo $! > mihomo.pid

          echo "等待 Mihomo 启动..."

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:9090/version \
              >/dev/null 2>&1; then

              echo "Mihomo API 启动成功"
              break
            fi

            sleep 1
          done

          if ! curl -fsS \
            http://127.0.0.1:9090/version \
            >/dev/null 2>&1; then

            echo "Mihomo API 启动失败"

            echo "================ Mihomo 日志 ================"

            cat mihomo.log

            echo "=============================================="

            exit 1
          fi

      - name: Test nodes
        run: |
          python3 <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          import yaml
          from pathlib import Path

          API = "http://127.0.0.1:9090"

          TEST_URL = (
              "https://www.gstatic.com/"
              "generate_204"
          )

          TIMEOUT = 5000

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:
              config = yaml.safe_load(f)

          proxies = config.get(
              "proxies",
              []
          )

          print(
              f"开始测试 {len(proxies)} 个节点"
          )

          print("=" * 70)

          alive = []
          dead = []

          for index, proxy in enumerate(
              proxies,
              1
          ):
              name = str(
                  proxy.get(
                      "name",
                      ""
                  )
              ).strip()

              if not name:
                  continue

              encoded_name = (
                  urllib.parse.quote(
                      name,
                      safe=""
                  )
              )

              query = (
                  "?url="
                  + urllib.parse.quote(
                      TEST_URL,
                      safe=""
                  )
                  + "&timeout="
                  + str(TIMEOUT)
                  + "&expected=204"
              )

              url = (
                  f"{API}/proxies/"
                  f"{encoded_name}/delay"
                  f"{query}"
              )

              try:
                  with urllib.request.urlopen(
                      url,
                      timeout=8
                  ) as response:

                      result = json.loads(
                          response.read()
                          .decode()
                      )

                  delay = int(
                      result.get(
                          "delay",
                          0
                      )
                  )

                  if delay > 0:
                      alive.append(
                          (
                              name,
                              delay
                          )
                      )

                      print(
                          f"[{index}/{len(proxies)}] "
                          f"OK {delay:>5} ms  {name}"
                      )

                  else:
                      dead.append(name)

                      print(
                          f"[{index}/{len(proxies)}] "
                          f"TIMEOUT       {name}"
                      )

              except Exception as e:
                  dead.append(name)

                  print(
                      f"[{index}/{len(proxies)}] "
                      f"FAILED        {name}"
                  )

              time.sleep(0.05)

          print("=" * 70)

          print(
              "可用节点:",
              len(alive)
          )

          print(
              "无效节点:",
              len(dead)
          )

          Path(
              "alive_nodes.json"
          ).write_text(
              json.dumps(
                  [
                      {
                          "name": name,
                          "delay": delay
                      }
                      for name, delay in alive
                  ],
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          if not alive:
              raise SystemExit(
                  "没有任何节点通过测试"
              )
          PY

      - name: Remove invalid nodes and sort
        run: |
          python3 <<'PY'
          import json
          import yaml

          with open(
              "alive_nodes.json",
              "r",
              encoding="utf-8"
          ) as f:
              alive = json.load(f)

          delays = {
              item["name"]: item["delay"]
              for item in alive
          }

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f)

          original = data.get(
              "proxies",
              []
          )

          data["proxies"] = [
              proxy
              for proxy in original
              if proxy.get("name") in delays
          ]

          data["proxies"] = sorted(
              data["proxies"],
              key=lambda proxy:
                  delays.get(
                      proxy.get("name"),
                      999999
                  )
          )

          for group in data.get(
              "proxy-groups",
              []
          ):
              if group.get(
                  "name"
              ) == "🚀 节点选择":

                  group["proxies"] = [
                      "⚡ 自动选择",
                      "DIRECT"
                  ] + [
                      proxy["name"]
                      for proxy in data[
                          "proxies"
                      ]
                  ]

              elif group.get(
                  "name"
              ) == "⚡ 自动选择":

                  group["proxies"] = [
                      proxy["name"]
                      for proxy in data[
                          "proxies"
                      ]
                  ]

          with open(
              "clash.yaml",
              "w",
              encoding="utf-8"
          ) as f:
              yaml.safe_dump(
                  data,
                  f,
                  allow_unicode=True,
                  sort_keys=False,
                  default_flow_style=False
              )

          print(
              "原始节点:",
              len(original)
          )

          print(
              "可用节点:",
              len(data["proxies"])
          )

          print(
              "删除无效节点:",
              len(original)
              - len(data["proxies"])
          )
          PY

      - name: Final validation
        run: |
          python3 <<'PY'
          import yaml
          from collections import Counter

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f)

          proxies = data.get(
              "proxies",
              []
          )

          if not proxies:
              raise SystemExit(
                  "最终配置没有可用节点"
              )

          names = [
              proxy.get("name")
              for proxy in proxies
          ]

          duplicates = [
              name
              for name, count in Counter(
                  names
              ).items()
              if count > 1
          ]

          if duplicates:
              raise SystemExit(
                  "存在重复节点: "
                  + ", ".join(duplicates)
              )

          print(
              "================================"
          )

          print(
              "Clash YAML 检查通过"
          )

          print(
              "最终可用节点:",
              len(proxies)
          )

          print(
              "重复节点: 0"
          )

          print(
              "================================"
          )
          PY

      - name: Show result
        run: |
          echo "=============================="

          python3 <<'PY'
          import yaml

          with open(
              "clash.yaml",
              "r",
              encoding="utf-8"
          ) as f:
              data = yaml.safe_load(f)

          print(
              "最终可用节点:",
              len(
                  data.get(
                      "proxies",
                      []
                  )
              )
          )
          PY

          echo "=============================="

      - name: Commit and push
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add clash.yaml

          if git diff --cached --quiet; then
            echo "没有变化，不提交"
          else
            git commit \
              -m "Update tested Clash nodes"

            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          if [ -f mihomo.pid ]; then
            kill "$(cat mihomo.pid)" \
              2>/dev/null || true
          fi
