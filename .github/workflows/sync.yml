name: V2Ray Ultimate Node Sync

on:
workflow_dispatch:
schedule:
- cron: "0 */4 * * *"

permissions:
contents: write

jobs:
sync:
runs-on: ubuntu-latest

```
steps:

  # =========================
  # 1. Checkout
  # =========================
  - name: Checkout
    uses: actions/checkout@v4

  # =========================
  # 2. Install dependencies
  # =========================
  - name: Install dependencies
    run: |
      sudo apt-get update -qq
      sudo apt-get install -y jq curl python3 python3-pip
      pip3 install --break-system-packages pyyaml

  # =========================
  # 3. Install sing-box
  # =========================
  - name: Install sing-box
    run: |
      VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
      VERSION=${VERSION#v}

      wget -q \
        "https://github.com/SagerNet/sing-box/releases/download/v${VERSION}/sing-box-${VERSION}-linux-amd64.tar.gz" \
        -O sing-box.tar.gz

      tar -xzf sing-box.tar.gz

      sudo install \
        sing-box-${VERSION}-linux-amd64/sing-box \
        /usr/local/bin/sing-box

      sing-box version

  # =========================
  # 4. Prepare directories
  # =========================
  - name: Prepare directories
    run: |
      mkdir -p data
      mkdir -p output

      touch nodes_all.txt
      touch alive_nodes.txt
      touch result.txt
      touch nodes.txt
      touch base64.txt

  # =========================
  # 5. Download clashfree latest YAML
  # =========================
  - name: Download clashfree latest nodes
    run: |
      python3 <<'PY'
      import requests
      import re
      import sys

      API = "https://api.github.com/repos/free-nodes/clashfree/contents"

      headers = {
          "Accept": "application/vnd.github+json",
          "User-Agent": "My-V2Ray-Nodes"
      }

      r = requests.get(API, headers=headers, timeout=30)
      r.raise_for_status()

      files = r.json()

      pattern = re.compile(r"^clash(\d{8})\.ya?ml$")

      candidates = []

      for item in files:
          name = item.get("name", "")

          if pattern.match(name):
              candidates.append(name)

      if not candidates:
          print("没有找到 clashYYYYMMDD.yml")
          sys.exit(1)

      candidates.sort(reverse=True)

      latest = candidates[0]

      url = f"https://raw.githubusercontent.com/free-nodes/clashfree/main/{latest}"

      print("使用最新文件:", latest)
      print("下载地址:", url)

      data = requests.get(
          url,
          headers={"User-Agent": "My-V2Ray-Nodes"},
          timeout=60
      )

      data.raise_for_status()

      with open("clashfree.yml", "wb") as f:
          f.write(data.content)

      print("下载完成:", len(data.content), "bytes")
      PY

  # =========================
  # 6. Extract clashfree proxies
  # =========================
  - name: Extract clashfree proxies
    run: |
      python3 <<'PY'
      import yaml

      INPUT = "clashfree.yml"
      OUTPUT = "clashfree_nodes.yml"

      with open(INPUT, "r", encoding="utf-8") as f:
          data = yaml.safe_load(f) or {}

      proxies = data.get("proxies", [])

      if not isinstance(proxies, list):
          proxies = []

      clean = []

      for proxy in proxies:
          if isinstance(proxy, dict):
              clean.append(proxy)

      output = {
          "proxies": clean
      }

      with open(
          OUTPUT,
          "w",
          encoding="utf-8"
      ) as f:
          yaml.safe_dump(
              output,
              f,
              allow_unicode=True,
              sort_keys=False
          )

      print("clashfree 节点数量:", len(clean))
      PY

  # =========================
  # 7. Convert clashfree nodes
  # =========================
  - name: Convert clashfree nodes
    run: |
      python3 <<'PY'
      import yaml

      INPUT = "clashfree_nodes.yml"
      OUTPUT = "clashfree_nodes.txt"

      with open(INPUT, "r", encoding="utf-8") as f:
          data = yaml.safe_load(f) or {}

      proxies = data.get("proxies", [])

      lines = []

      for p in proxies:

          if not isinstance(p, dict):
              continue

          name = p.get("name", "ClashFree")

          ptype = str(p.get("type", "")).lower()

          server = p.get("server")
          port = p.get("port")

          if not server or not port:
              continue

          # =========================
          # Shadowsocks
          # =========================
          if ptype in ["ss", "shadowsocks"]:

              cipher = p.get("cipher")
              password = p.get("password")

              if cipher and password:
                  lines.append(
                      f"ss://{cipher}:{password}@{server}:{port}#{name}"
                  )

          # =========================
          # Trojan
          # =========================
          elif ptype == "trojan":

              password = p.get("password")

              if password:
                  lines.append(
                      f"trojan://{password}@{server}:{port}#{name}"
                  )

          # =========================
          # VMess
          # =========================
          elif ptype == "vmess":

              uuid = p.get("uuid")

              if uuid:
                  lines.append(
                      f"vmess://{uuid}@{server}:{port}#{name}"
                  )

          # =========================
          # HTTP / SOCKS5
          # =========================
          elif ptype in ["http", "socks5"]:

              lines.append(
                  f"{ptype}://{server}:{port}#{name}"
              )

      with open(
          OUTPUT,
          "w",
          encoding="utf-8"
      ) as f:
          f.write("\n".join(lines))

      print("转换节点数量:", len(lines))
      PY

  # =========================
  # 8. Merge all node sources
  # =========================
  - name: Merge nodes
    run: |
      cat clashfree_nodes.txt >> nodes_all.txt

      if [ -f data/links.txt ]; then
        while IFS= read -r url; do
          [ -z "$url" ] && continue

          echo "读取订阅: $url"

          curl -L \
            --max-time 60 \
            --retry 2 \
            -A "Mozilla/5.0" \
            "$url" \
            >> nodes_all.txt || true

          echo "" >> nodes_all.txt

        done < data/links.txt
      fi

      sed -i 's/\r$//' nodes_all.txt

      grep -v '^[[:space:]]*$' nodes_all.txt \
        | sort -u \
        > nodes_all.tmp

      mv nodes_all.tmp nodes_all.txt

      echo "合并后节点数量:"
      wc -l nodes_all.txt

  # =========================
  # 9. Extract standard node URLs
  # =========================
  - name: Normalize nodes
    run: |
      python3 <<'PY'
      import re
      import base64

      INPUT = "nodes_all.txt"
      OUTPUT = "nodes.txt"

      protocols = (
          "vmess://",
          "vless://",
          "trojan://",
          "ss://",
          "ssr://",
          "hysteria://",
          "hysteria2://",
          "hy2://",
          "tuic://",
          "socks5://",
          "http://",
          "https://"
      )

      result = []

      with open(INPUT, "r", encoding="utf-8", errors="ignore") as f:

          for line in f:

              line = line.strip()

              if not line:
                  continue

              if line.startswith(protocols):
                  result.append(line)
                  continue

              # Base64 尝试解码
              try:

                  padded = line + "=" * (-len(line) % 4)

                  decoded = base64.b64decode(
                      padded
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

                  for item in decoded.splitlines():

                      item = item.strip()

                      if item.startswith(protocols):
                          result.append(item)

              except Exception:
                  pass

      result = list(dict.fromkeys(result))

      with open(
          OUTPUT,
          "w",
          encoding="utf-8"
      ) as f:

          f.write(
              "\n".join(result)
          )

      print("标准节点数量:", len(result))
      PY

  # =========================
  # 10. Keep all nodes
  # =========================
  - name: Prepare alive nodes
    run: |
      cp nodes.txt alive_nodes.txt

      echo "当前节点数量:"
      wc -l alive_nodes.txt

  # =========================
  # 11. Generate Clash YAML
  # =========================
  - name: Generate clash.yaml
    run: |
      python3 <<'PY'
      import yaml
      import base64
      import urllib.parse
      import re

      INPUT = "clashfree.yml"
      OUTPUT = "clash.yaml"

      with open(
          INPUT,
          "r",
          encoding="utf-8"
      ) as f:
          source = yaml.safe_load(f) or {}

      proxies = source.get("proxies", [])

      if not isinstance(proxies, list):
          proxies = []

      clean = []

      seen = set()

      for p in proxies:

          if not isinstance(p, dict):
              continue

          server = p.get("server")
          port = p.get("port")
          ptype = p.get("type")

          if not server or not port or not ptype:
              continue

          key = (
              str(ptype),
              str(server),
              str(port),
              str(p.get("uuid", "")),
              str(p.get("password", "")),
              str(p.get("cipher", "")),
          )

          if key in seen:
              continue

          seen.add(key)

          clean.append(p)

      # =========================
      # Proxy groups
      # =========================

      names = [
          p.get("name")
          for p in clean
          if p.get("name")
      ]

      config = {
          "mixed-port": 7890,
          "allow-lan": False,
          "mode": "rule",
          "log-level": "info",

          "proxies": clean,

          "proxy-groups": [
              {
                  "name": "🚀 节点选择",
                  "type": "select",
                  "proxies": [
                      "♻️ 自动选择",
                      "DIRECT"
                  ] + names
              },
              {
                  "name": "♻️ 自动选择",
                  "type": "url-test",
                  "url": "http://www.gstatic.com/generate_204",
                  "interval": 300,
                  "tolerance": 50,
                  "proxies": names
              }
          ],

          "rules": [
              "MATCH,🚀 节点选择"
          ]
      }

      with open(
          OUTPUT,
          "w",
          encoding="utf-8"
      ) as f:

          yaml.safe_dump(
              config,
              f,
              allow_unicode=True,
              sort_keys=False
          )

      print("最终 Clash 节点数量:", len(clean))
      PY

  # =========================
  # 12. Generate Base64
  # =========================
  - name: Generate base64.txt
    run: |
      base64 -w 0 nodes.txt > base64.txt
      echo >> base64.txt

  # =========================
  # 13. Generate result.txt
  # =========================
  - name: Generate result.txt
    run: |
      {
        echo "My-V2Ray-Nodes"
        echo
        echo "Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
        echo
        echo "Total nodes:"
        wc -l < nodes.txt
        echo
        echo "ClashFree source:"
        echo "https://github.com/free-nodes/clashfree"
      } > result.txt

  # =========================
  # 14. Save source information
  # =========================
  - name: Save source information
    run: |
      {
        echo "ClashFree"
        echo "https://github.com/free-nodes/clashfree"
        echo
        echo "Generated:"
        date -u '+%Y-%m-%d %H:%M:%S UTC'
      } > output/source.txt

  # =========================
  # 15. Git commit
  # =========================
  - name: Commit changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add \
        nodes_all.txt \
        alive_nodes.txt \
        result.txt \
        nodes.txt \
        base64.txt \
        clash.yaml \
        output/source.txt

      git diff --cached --quiet || \
        git commit -m "Auto update nodes"

      git push
```
