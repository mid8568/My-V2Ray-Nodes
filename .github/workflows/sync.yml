name: V2Ray Ultimate Node Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq python3 python3-pip wget
          pip3 install --break-system-packages pyyaml requests

      - name: Prepare files
        run: |
          mkdir -p output
          touch nodes_all.txt
          touch alive_nodes.txt
          touch result.txt
          touch nodes.txt
          touch base64.txt

      - name: Download V2RayFree source
        run: |
          curl -L \
            --max-time 120 \
            --retry 3 \
            --retry-delay 5 \
            --silent \
            --show-error \
            -A "Mozilla/5.0" \
            "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub" \
            -o v2rayfree_sub.txt

          echo "V2RayFree source downloaded"

          echo "文件大小:"
          wc -c v2rayfree_sub.txt

          echo "前几行:"
          head -n 5 v2rayfree_sub.txt || true

      - name: Decode V2RayFree subscription
        run: |
          python3 <<'PY'
          import base64
          import re

          INPUT = "v2rayfree_sub.txt"
          OUTPUT = "v2rayfree_nodes.txt"

          protocols = (
              "vmess://",
              "vless://",
              "trojan://",
              "ss://",
              "ssr://",
              "hysteria://",
              "hysteria2://",
              "hy2://",
              "tuic://",
              "socks5://",
              "http://",
              "https://"
          )

          with open(INPUT, "rb") as f:
              raw = f.read()

          text = raw.decode("utf-8", errors="ignore").strip()

          nodes = []

          # 先尝试直接读取协议节点
          for line in text.splitlines():
              line = line.strip()

              if not line:
                  continue

              if line.startswith(protocols):
                  nodes.append(line)

          # 如果没有直接节点，则尝试 Base64 解码
          if not nodes:
              compact = re.sub(r"\s+", "", text)

              try:
                  padded = compact + "=" * (-len(compact) % 4)

                  decoded = base64.b64decode(
                      padded,
                      validate=False
                  ).decode(
                      "utf-8",
                      errors="ignore"
                  )

                  for line in decoded.splitlines():
                      line = line.strip()

                      if line.startswith(protocols):
                          nodes.append(line)

              except Exception as e:
                  print("Base64 解码失败:", e)

          # 去重
          nodes = list(dict.fromkeys(nodes))

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(nodes))

          print("V2RayFree 节点数量:", len(nodes))

          if not nodes:
              print("WARNING: 没有提取到节点")
          PY

      - name: Merge additional sources
        run: |
          cat v2rayfree_nodes.txt >> nodes_all.txt

          if [ -f data/links.txt ]; then
            while IFS= read -r url; do

              if [ -z "$url" ]; then
                continue
              fi

              echo "读取额外订阅:"
              echo "$url"

              curl -L \
                --max-time 120 \
                --retry 2 \
                --silent \
                --show-error \
                -A "Mozilla/5.0" \
                "$url" >> nodes_all.txt || true

              echo "" >> nodes_all.txt

            done < data/links.txt
          else
            echo "没有找到 data/links.txt"
          fi

          sed -i 's/\r$//' nodes_all.txt

          grep -v '^[[:space:]]*$' nodes_all.txt \
            | sort -u \
            > nodes_all.tmp || true

          mv nodes_all.tmp nodes_all.txt

          echo "合并完成"

          echo "nodes_all.txt 行数:"
          wc -l nodes_all.txt

      - name: Extract node URLs
        run: |
          python3 <<'PY'
          import base64

          protocols = (
              "vmess://",
              "vless://",
              "trojan://",
              "ss://",
              "ssr://",
              "hysteria://",
              "hysteria2://",
              "hy2://",
              "tuic://",
              "socks5://",
              "http://",
              "https://"
          )

          result = []

          with open(
              "nodes_all.txt",
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:

              for line in f:
                  line = line.strip()

                  if not line:
                      continue

                  # 直接节点
                  if line.startswith(protocols):
                      result.append(line)
                      continue

                  # Base64 订阅
                  try:
                      padded = line + "=" * (-len(line) % 4)

                      decoded = base64.b64decode(
                          padded,
                          validate=False
                      ).decode(
                          "utf-8",
                          errors="ignore"
                      )

                      for item in decoded.splitlines():
                          item = item.strip()

                          if item.startswith(protocols):
                              result.append(item)

                  except Exception:
                      pass

          # 去重
          result = list(dict.fromkeys(result))

          with open(
              "nodes.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write("\n".join(result))

          print("标准节点数量:", len(result))
          PY

      - name: Prepare alive nodes
        run: |
          cp nodes.txt alive_nodes.txt

          echo "当前节点数量:"
          wc -l alive_nodes.txt

      - name: Generate Clash YAML
        run: |
          python3 <<'PY'
          import yaml
          import base64
          import urllib.parse
          import json

          INPUT = "nodes.txt"
          OUTPUT = "clash.yaml"

          proxies = []

          with open(
              INPUT,
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:

              for index, line in enumerate(f, 1):

                  line = line.strip()

                  if not line:
                      continue

                  try:

                      # ==========================
                      # VMESS
                      # ==========================
                      if line.startswith("vmess://"):

                          raw = line[8:]
                          padded = raw + "=" * (-len(raw) % 4)

                          decoded = base64.b64decode(
                              padded
                          ).decode(
                              "utf-8",
                              errors="ignore"
                          )

                          data = json.loads(decoded)

                          server = data.get("add")
                          port = int(data.get("port", 443))
                          uuid = data.get("id")

                          if not server or not uuid:
                              continue

                          proxy = {
                              "name": data.get(
                                  "ps",
                                  f"VMess-{index}"
                              ),
                              "type": "vmess",
                              "server": server,
                              "port": port,
                              "uuid": uuid,
                              "alterId": int(
                                  data.get("aid", 0)
                              ),
                              "cipher": "auto"
                          }

                          net = data.get("net", "tcp")

                          if net:
                              proxy["network"] = net

                          if data.get("tls") == "tls":
                              proxy["tls"] = True

                          if data.get("sni"):
                              proxy["servername"] = data["sni"]

                          proxies.append(proxy)

                      # ==========================
                      # VLESS
                      # ==========================
                      elif line.startswith("vless://"):

                          parsed = urllib.parse.urlparse(line)

                          uuid = parsed.username
                          server = parsed.hostname
                          port = parsed.port

                          if not uuid or not server or not port:
                              continue

                          params = urllib.parse.parse_qs(
                              parsed.query
                          )

                          name = urllib.parse.unquote(
                              parsed.fragment
                          ) or f"VLESS-{index}"

                          proxy = {
                              "name": name,
                              "type": "vless",
                              "server": server,
                              "port": port,
                              "uuid": uuid
                          }

                          if params.get("security", [""])[0] == "tls":
                              proxy["tls"] = True

                          if params.get("sni"):
                              proxy["servername"] = params["sni"][0]

                          if params.get("type"):
                              proxy["network"] = params["type"][0]

                          proxies.append(proxy)

                      # ==========================
                      # TROJAN
                      # ==========================
                      elif line.startswith("trojan://"):

                          parsed = urllib.parse.urlparse(line)

                          password = parsed.username
                          server = parsed.hostname
                          port = parsed.port

                          if not password or not server or not port:
                              continue

                          params = urllib.parse.parse_qs(
                              parsed.query
                          )

                          name = urllib.parse.unquote(
                              parsed.fragment
                          ) or f"Trojan-{index}"

                          proxy = {
                              "name": name,
                              "type": "trojan",
                              "server": server,
                              "port": port,
                              "password": password
                          }

                          if params.get("sni"):
                              proxy["sni"] = params["sni"][0]

                          proxies.append(proxy)

                      # ==========================
                      # SOCKS5
                      # ==========================
                      elif line.startswith("socks5://"):

                          parsed = urllib.parse.urlparse(line)

                          server = parsed.hostname
                          port = parsed.port

                          if not server or not port:
                              continue

                          name = urllib.parse.unquote(
                              parsed.fragment
                          ) or f"SOCKS5-{index}"

                          proxy = {
                              "name": name,
                              "type": "socks5",
                              "server": server,
                              "port": port
                          }

                          if parsed.username:
                              proxy["username"] = parsed.username

                          if parsed.password:
                              proxy["password"] = parsed.password

                          proxies.append(proxy)

                      # ==========================
                      # HTTP
                      # ==========================
                      elif line.startswith("http://"):

                          parsed = urllib.parse.urlparse(line)

                          server = parsed.hostname
                          port = parsed.port

                          if not server or not port:
                              continue

                          name = urllib.parse.unquote(
                              parsed.fragment
                          ) or f"HTTP-{index}"

                          proxy = {
                              "name": name,
                              "type": "http",
                              "server": server,
                              "port": port
                          }

                          if parsed.username:
                              proxy["username"] = parsed.username

                          if parsed.password:
                              proxy["password"] = parsed.password

                          proxies.append(proxy)

                  except Exception as e:
                      print(
                          f"跳过节点 {index}:",
                          str(e)
                      )

          # 去除完全相同的节点
          clean = []
          seen = set()

          for proxy in proxies:

              key = (
                  proxy.get("type"),
                  proxy.get("server"),
                  proxy.get("port"),
                  proxy.get("uuid"),
                  proxy.get("password"),
                  proxy.get("cipher")
              )

              if key in seen:
                  continue

              seen.add(key)
              clean.append(proxy)

          # 强制保证每个节点名称唯一
          name_count = {}
          unique_names = []

          for index, proxy in enumerate(clean, 1):

              base_name = str(
                  proxy.get("name") or f"Node-{index}"
              ).strip()

              if not base_name:
                  base_name = f"Node-{index}"

              if base_name not in name_count:
                  name_count[base_name] = 1
                  final_name = base_name
              else:
                  name_count[base_name] += 1
                  final_name = (
                      f"{base_name}-{name_count[base_name]}"
                  )

              proxy["name"] = final_name
              unique_names.append(final_name)
          config = {
              "mixed-port": 7890,
              "allow-lan": False,
              "mode": "rule",
              "log-level": "info",

              "proxies": clean,

              "proxy-groups": [
                  {
                      "name": "🚀 节点选择",
                      "type": "select",
                      "proxies": [
                          "♻️ 自动选择",
                          "DIRECT"
                      ] + unique_names
                  },
                  {
                      "name": "♻️ 自动选择",
                      "type": "url-test",
                      "url": "http://www.gstatic.com/generate_204",
                      "interval": 300,
                      "tolerance": 50,
                      "proxies": unique_names
                  }
              ],

              "rules": [
                  "MATCH,🚀 节点选择"
              ]
          }

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:

              yaml.safe_dump(
                  config,
                  f,
                  allow_unicode=True,
                  sort_keys=False
              )

          print(
              "Clash YAML 节点数量:",
              len(clean)
          )
          PY

      - name: Generate Base64
        run: |
          base64 -w 0 nodes.txt > base64.txt
          echo >> base64.txt

      - name: Generate result
        run: |
          {
            echo "My-V2Ray-Nodes"
            echo
            echo "Updated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo
            echo "Total nodes:"
            wc -l < nodes.txt
            echo
            echo "V2RayFree source:"
            echo "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
          } > result.txt

      - name: Save source information
        run: |
          {
            echo "V2RayFree"
            echo "https://raw.githubusercontent.com/free-nodes/v2rayfree/main/sub"
            echo
            echo "Updated:"
            date -u '+%Y-%m-%d %H:%M:%S UTC'
          } > output/source.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            nodes_all.txt \
            alive_nodes.txt \
            result.txt \
            nodes.txt \
            base64.txt \
            clash.yaml \
            output/source.txt

          if git diff --cached --quiet; then
            echo "没有新的变化"
          else
            git commit -m "Update V2RayFree nodes"
            git push
          fi
