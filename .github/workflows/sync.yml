```yaml
name: V2Ray Ultimate Node Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl jq python3 python3-yaml gzip

      - name: Download Mihomo
        shell: bash
        run: |
          set -e

          URL=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-compatible-.*\\.gz$")) | .browser_download_url' \
            | head -n 1)

          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "无法找到 Mihomo Linux amd64 compatible 版本"
            exit 1
          fi

          echo "下载 Mihomo:"
          echo "$URL"

          curl -fL "$URL" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo

          ./mihomo -v

      - name: Download source subscription
        run: |
          set -e

          curl -fL \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 120 \
            "https://github.com/Au1rxx/free-vpn-subscriptions/raw/main/output/clash.yaml" \
            -o source.yaml

          test -s source.yaml

          echo "原始订阅大小:"
          wc -c source.yaml

          echo "节点数量:"
          python3 - <<'PY'
          import yaml

          with open("source.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          proxies = data.get("proxies", [])

          print(len(proxies))
          PY

      - name: Prepare Mihomo test config
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path("source.yaml").read_text(encoding="utf-8")

          prefix = ""

          if not any(line.startswith("mixed-port:") for line in src.splitlines()):
              prefix += "mixed-port: 7890\n"

          if not any(line.startswith("external-controller:") for line in src.splitlines()):
              prefix += "external-controller: 127.0.0.1:9090\n"

          if not any(line.startswith("secret:") for line in src.splitlines()):
              prefix += "secret: \"\"\n"

          Path("test.yaml").write_text(prefix + src, encoding="utf-8")
          PY

          echo "启动 Mihomo..."

          nohup ./mihomo -d . -f test.yaml > mihomo.log 2>&1 &
          echo $! > mihomo.pid

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9090/version >/dev/null 2>&1; then
              echo "Mihomo 启动成功"
              break
            fi

            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:9090/version >/dev/null 2>&1; then
            echo "Mihomo 启动失败"
            cat mihomo.log
            exit 1
          fi

      - name: Test nodes
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          API = "http://127.0.0.1:9090"
          TEST_URL = "https://www.gstatic.com/generate_204"
          TIMEOUT = 5000

          def api(path):
              req = urllib.request.Request(API + path)
              with urllib.request.urlopen(req, timeout=10) as r:
                  return json.loads(r.read().decode())

          with open("source.yaml", "r", encoding="utf-8") as f:
              import yaml
              config = yaml.safe_load(f)

          proxies = config.get("proxies", [])

          print(f"开始测试 {len(proxies)} 个节点")
          print("=" * 60)

          alive = []
          dead = []

          for index, proxy in enumerate(proxies, 1):
              name = str(proxy.get("name", "")).strip()

              if not name:
                  continue

              encoded_name = urllib.parse.quote(name, safe="")

              query = (
                  "?url="
                  + urllib.parse.quote(TEST_URL, safe="")
                  + "&timeout="
                  + str(TIMEOUT)
                  + "&expected=204"
              )

              url = f"{API}/proxies/{encoded_name}/delay{query}"

              try:
                  with urllib.request.urlopen(url, timeout=8) as r:
                      result = json.loads(r.read().decode())

                  delay = int(result.get("delay", 0))

                  if delay > 0:
                      alive.append((name, delay))
                      print(f"[{index}/{len(proxies)}] OK      {delay:>5} ms  {name}")
                  else:
                      dead.append(name)
                      print(f"[{index}/{len(proxies)}] TIMEOUT         {name}")

              except Exception as e:
                  dead.append(name)
                  print(f"[{index}/{len(proxies)}] FAILED          {name}")

              time.sleep(0.05)

          print("=" * 60)
          print(f"可用节点: {len(alive)}")
          print(f"无效节点: {len(dead)}")

          Path("alive_nodes.json").write_text(
              json.dumps(
                  [{"name": n, "delay": d} for n, d in alive],
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          Path("dead_nodes.json").write_text(
              json.dumps(dead, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )

          if len(alive) == 0:
              print("没有任何节点通过测试")
              print("保留原订阅，避免 GitHub 发布空配置")
              raise SystemExit(2)
          PY

      - name: Remove invalid nodes
        run: |
          python3 - <<'PY'
          import json
          import yaml

          with open("source.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          with open("alive_nodes.json", "r", encoding="utf-8") as f:
              alive_data = json.load(f)

          alive_names = {x["name"] for x in alive_data}

          original_proxies = data.get("proxies", [])

          data["proxies"] = [
              proxy
              for proxy in original_proxies
              if proxy.get("name") in alive_names
          ]

          valid_names = {
              proxy.get("name")
              for proxy in data["proxies"]
          }

          removed_groups = 0

          for group in data.get("proxy-groups", []):
              if "proxies" not in group:
                  continue

              old_list = group["proxies"]

              new_list = [
                  name
                  for name in old_list
                  if name in valid_names
                  or name in {
                      "DIRECT",
                      "REJECT",
                      "PASS",
                      "COMPATIBLE"
                  }
              ]

              removed_groups += len(old_list) - len(new_list)

              group["proxies"] = new_list

          with open("clash.yaml", "w", encoding="utf-8") as f:
              yaml.safe_dump(
                  data,
                  f,
                  allow_unicode=True,
                  sort_keys=False,
                  default_flow_style=False
              )

          print("原始节点:", len(original_proxies))
          print("有效节点:", len(data["proxies"]))
          print("删除节点:", len(original_proxies) - len(data["proxies"]))
          print("清理策略组引用:", removed_groups)
          PY

      - name: Sort nodes by latency
        run: |
          python3 - <<'PY'
          import json
          import yaml

          with open("alive_nodes.json", "r", encoding="utf-8") as f:
              alive = json.load(f)

          delays = {
              item["name"]: item["delay"]
              for item in alive
          }

          with open("clash.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          data["proxies"] = sorted(
              data.get("proxies", []),
              key=lambda x: delays.get(x.get("name"), 999999)
          )

          with open("clash.yaml", "w", encoding="utf-8") as f:
              yaml.safe_dump(
                  data,
                  f,
                  allow_unicode=True,
                  sort_keys=False,
                  default_flow_style=False
              )
          PY

      - name: Validate output
        run: |
          python3 - <<'PY'
          import yaml

          with open("clash.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          proxies = data.get("proxies", [])

          if not proxies:
              raise SystemExit("最终配置没有可用节点")

          print("最终节点数量:", len(proxies))
          print("Clash YAML 格式检查通过")
          PY

      - name: Show result
        run: |
          echo "=============================="
          echo "最终可用节点数量:"
          python3 - <<'PY'
          import yaml

          with open("clash.yaml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          print(len(data.get("proxies", [])))
          PY
          echo "=============================="

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add clash.yaml

          if git diff --cached --quiet; then
            echo "没有变化，不提交"
          else
            git commit -m "Update tested Clash nodes"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          if [ -f mihomo.pid ]; then
            kill "$(cat mihomo.pid)" 2>/dev/null || true
          fi
```
